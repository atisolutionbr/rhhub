services:
  web:
    image: nginx:stable-alpine@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
    container_name: rhhub-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:18110:80"
    volumes:
      - "${RHHUB_RELEASE:?Configure o diretório da versão}/dist:/usr/share/nginx/html:ro"
      - "${RHHUB_RELEASE:?Configure o diretório da versão}/infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
